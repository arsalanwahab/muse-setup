<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background: #f5f5f7; color: #1d1d1f; overflow: hidden;
  }
  .card {
    height: 100%; padding: 22px 24px; display: flex; flex-direction: column; gap: 12px;
    background: linear-gradient(160deg, #ffffff 0%, #f2f2f5 100%);
  }
  .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8a8a8e; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff9f0a; box-shadow: 0 0 0 4px rgba(255,159,10,.15); }
  .on .dot { background: #30d158; box-shadow: 0 0 0 4px rgba(48,209,88,.15); }
  .on .label { color: #1d7a3a; }
  .off .label { color: #9a6200; }
  .host { font-size: 11.5px; color: #6e6e73; }
  .spacer { flex: 1; }
  button {
    appearance: none; border: 0; border-radius: 10px; padding: 10px 14px;
    font: inherit; font-weight: 600; color: #fff; background: #0071e3; cursor: pointer;
    transition: background .15s ease, transform .08s ease;
  }
  button:hover { background: #0077ed; }
  button:active { transform: scale(.985); }
  button.off { background: #e8e8ed; color: #1d1d1f; }
  button.off:hover { background: #dededf; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .link {
    background: none; color: #0071e3; font-weight: 500; padding: 2px 0;
    text-align: left; width: auto;
  }
  .link:hover { background: none; text-decoration: underline; }
  .foot { font-size: 10.5px; color: #8a8a8e; line-height: 1.4; }
  .panel { display: none; flex-direction: column; gap: 8px; }
  .panel.show { display: flex; }
  input {
    font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #d2d2d7;
    background: #fff; color: inherit; width: 100%;
  }
  input:focus { outline: 2px solid #0071e3; outline-offset: -1px; border-color: transparent; }
  #setupMsg { font-size: 11px; color: #6e6e73; min-height: 15px; }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1e; color: #f5f5f7; }
    .card { background: linear-gradient(160deg, #2c2c2e 0%, #1f1f21 100%); }
    .host, .foot, #setupMsg { color: #98989d; }
    button.off { background: #3a3a3c; color: #f5f5f7; }
    button.off:hover { background: #48484a; }
    input { background: #1c1c1e; border-color: #3a3a3c; }
    .link { color: #4da3ff; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Pantheon</div>
    <h1>Muse egress</h1>

    <div id="main">
      <div id="status" class="status off">
        <span class="dot"></span>
        <span class="label">US egress OFF</span>
      </div>
      <div id="host" class="host">direct — no models available here</div>
    </div>

    <div id="setup" class="panel">
      <input id="u" placeholder="Proxy username" autocomplete="off">
      <input id="p" type="password" placeholder="Proxy password" autocomplete="off">
      <input id="k" type="password" placeholder="Meta API key" autocomplete="off">
      <div class="row">
        <button id="save" onclick="save()">Save &amp; verify</button>
        <button class="off" onclick="hideSetup()">Cancel</button>
      </div>
      <div id="setupMsg"></div>
      <div class="row" style="margin-top:2px">
        <input id="cfg" placeholder="Config URL (optional)" autocomplete="off">
        <button class="off" onclick="loadConfig()">Load</button>
      </div>
    </div>

    <div class="spacer"></div>

    <div id="actions">
      <button id="toggle" class="off" onclick="post({action:'toggle'})">Turn On</button>
      <button class="link" onclick="showSetup()">Set up / change key…</button>
    </div>

    <div class="foot">Only model API traffic is routed. Your code and commands stay on this Mac.</div>
  </div>

  <script>
    function post(message) { window.webkit.messageHandlers.muse.postMessage(message); }

    function update(state) {
      if (state.setup) return;
      const status = document.getElementById('status');
      status.className = 'status ' + (state.on ? 'on' : 'off');
      status.querySelector('.label').textContent = state.on ? 'US egress ON' : 'US egress OFF';
      document.getElementById('host').textContent = state.on ? 'via ' + state.host : 'direct — no models available here';
      const button = document.getElementById('toggle');
      button.textContent = state.on ? 'Turn Off' : 'Turn On';
      button.className = state.on ? '' : 'off';
    }

    function showSetup() {
      document.getElementById('main').style.display = 'none';
      document.getElementById('actions').style.display = 'none';
      document.getElementById('setup').classList.add('show');
      document.getElementById('setupMsg').textContent = 'Use the proxy login from your admin and your own API key.';
      document.getElementById('u').focus();
    }

    function hideSetup() {
      document.getElementById('setup').classList.remove('show');
      document.getElementById('main').style.display = '';
      document.getElementById('actions').style.display = '';
    }

    function save() {
      const user = document.getElementById('u').value.trim();
      const pass = document.getElementById('p').value;
      const key = document.getElementById('k').value.trim();
      if (!user || !pass || !key) {
        document.getElementById('setupMsg').textContent = 'All three fields are required.';
        return;
      }
      document.getElementById('save').disabled = true;
      document.getElementById('save').textContent = 'Working…';
      document.getElementById('setupMsg').textContent = 'Installing and verifying. This can take a minute.';
      post({action: 'setup', user: user, pass: pass, key: key});
    }

    function loadConfig() {
      const url = document.getElementById('cfg').value.trim();
      if (!url) { document.getElementById('setupMsg').textContent = 'Paste a config URL first.'; return; }
      document.getElementById('setupMsg').textContent = 'Downloading config…';
      post({action: 'loadConfig', url: url});
    }

    function configResult(result) {
      document.getElementById('setupMsg').textContent = result.message;
    }

    function setupResult(result) {
      const button = document.getElementById('save');
      button.disabled = false;
      button.textContent = 'Save & verify';
      if (result.ok) {
        document.getElementById('u').value = '';
        document.getElementById('p').value = '';
        document.getElementById('k').value = '';
        document.getElementById('setupMsg').textContent = 'Ready.';
        hideSetup();
      } else {
        document.getElementById('setupMsg').textContent = result.message;
      }
    }

    window.addEventListener('load', () => post({action: 'status'}));
  </script>
</body>
</html>
