<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    font: 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background: #f5f5f7; color: #1d1d1f;
  }
  .card {
    width: 100%; height: 100%; padding: 22px 24px; display: flex; flex-direction: column;
    gap: 14px; background: linear-gradient(160deg, #ffffff 0%, #f2f2f5 100%);
  }
  .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8a8a8e; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff9f0a; box-shadow: 0 0 0 4px rgba(255,159,10,.15); }
  .on .dot { background: #30d158; box-shadow: 0 0 0 4px rgba(48,209,88,.15); }
  .on .label { color: #1d7a3a; }
  .off .label { color: #9a6200; }
  .host { font-size: 11.5px; color: #6e6e73; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  button {
    appearance: none; border: 0; border-radius: 10px; padding: 10px 14px; width: 100%;
    font: inherit; font-weight: 600; color: #fff; background: #0071e3; cursor: pointer;
    transition: background .15s ease, transform .08s ease;
  }
  button:hover { background: #0077ed; }
  button:active { transform: scale(.985); }
  button.off { background: #e8e8ed; color: #1d1d1f; }
  button.off:hover { background: #dededf; }
  .foot { font-size: 10.5px; color: #8a8a8e; line-height: 1.4; }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1e; color: #f5f5f7; }
    .card { background: linear-gradient(160deg, #2c2c2e 0%, #1f1f21 100%); }
    .host, .foot { color: #98989d; }
    button.off { background: #3a3a3c; color: #f5f5f7; }
    button.off:hover { background: #48484a; }
  }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="eyebrow">Pantheon</div>
      <h1>Muse egress</h1>
    </div>
    <div id="status" class="status off">
      <span class="dot"></span>
      <span class="label">US egress OFF</span>
    </div>
    <div id="host" class="host">direct — no models available here</div>
    <div class="spacer"></div>
    <button id="toggle" class="off" onclick="post('toggle')">Turn On</button>
    <div class="foot">Only model API traffic is routed. Your code and commands stay on this Mac.</div>
  </div>
  <script>
    function post(action) { window.webkit.messageHandlers.muse.postMessage(action); }

    function update(state) {
      const status = document.getElementById('status');
      const host = document.getElementById('host');
      const button = document.getElementById('toggle');
      status.className = 'status ' + (state.on ? 'on' : 'off');
      status.querySelector('.label').textContent = state.on ? 'US egress ON' : 'US egress OFF';
      host.textContent = state.on ? 'via ' + state.host : 'direct — no models available here';
      button.textContent = state.on ? 'Turn Off' : 'Turn On';
      button.className = state.on ? '' : 'off';
    }

    window.addEventListener('load', () => post('status'));
  </script>
</body>
</html>
